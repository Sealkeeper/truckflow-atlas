name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: python syntax
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q coord scripts accuracy invention research 2>/dev/null || true

      - name: evaluator tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q coord/evaluation-v3/tests

      # Detector names do not tell us whether code runs offline or on the live path.
      # Keep discovery advisory; runtime/teacher isolation is reviewed in the PR.
      - name: review detector usage (advisory)
        run: |
          set +e
          git grep -n -I -E 'ultralytics|torch\.hub\.load\(.ultralytics' -- '*.py' '*requirements*.txt' '*pyproject.toml' '*Dockerfile*'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::warning::发现检测器引用：离线教师允许；请人工确认实时解析链路和最终学生不依赖同类检测器。参见 CONTRIBUTING.md。"
          elif [ "$status" -ne 1 ]; then
            exit "$status"
          fi
